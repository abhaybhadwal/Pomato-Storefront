<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | POMATO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Outfit', sans-serif; background: #030303; color:#fff; overflow: hidden; }
    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob { animation: blob 7s infinite; }
    .animation-delay-2000 { animation-delay: 2s; }
    .animation-delay-4000 { animation-delay: 4s; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative px-6">
  <!-- Background Blobs -->
  <div class="absolute top-0 -left-4 w-72 h-72 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
  <div class="absolute top-0 -right-4 w-72 h-72 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
  <div class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>

  <div class="glass w-full max-w-[400px] p-10 rounded-[2.5rem] relative z-10">
    <div class="flex flex-col items-center mb-10">
      <a href="index.html" class="flex flex-col items-center gap-3 group">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center shadow-xl shadow-blue-500/20 group-hover:scale-110 transition-transform duration-500">
          <span class="text-white text-3xl material-symbols-outlined">change_history</span>
        </div>
        <h1 class="text-2xl font-black tracking-widest uppercase">POMATO</h1>
      </a>
    </div>

    <h2 class="text-3xl font-bold mb-2 text-center">Welcome Back</h2>
    <p class="text-white/40 text-center mb-8 text-sm">Enter your credentials to access your account</p>

    <form id="loginForm" class="space-y-5">
      <div class="relative group">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/30 group-focus-within:text-blue-400 transition-colors">mail</span>
        <input type="email" id="email" placeholder="Email Address" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-white focus:outline-none focus:border-blue-500 focus:bg-white/10 transition-all" required />
      </div>
      
      <div class="relative group">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/30 group-focus-within:text-blue-400 transition-colors">lock</span>
        <input type="password" id="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-white focus:outline-none focus:border-blue-500 focus:bg-white/10 transition-all" required />
      </div>

      <div class="flex justify-end">
        <a href="#" class="text-xs text-blue-400 hover:text-blue-300 transition-colors">Forgot password?</a>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-600/20 transition-all active:scale-95 mt-4">
        Sign In
      </button>
    </form>

    <!-- Social Login Mockup -->
    <div class="mt-8">
        <div class="relative flex items-center justify-center mb-6">
            <div class="border-t border-white/10 w-full"></div>
            <span class="bg-[#0b0b0b] px-4 text-xs text-white/30 uppercase tracking-widest absolute">Or continue with</span>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <button class="flex items-center justify-center gap-2 bg-white/5 border border-white/10 py-3 rounded-xl hover:bg-white/10 transition-colors">
                <img src="https://www.google.com/favicon.ico" class="w-4 h-4 grayscale" />
                <span class="text-xs font-medium">Google</span>
            </button>
            <button class="flex items-center justify-center gap-2 bg-white/5 border border-white/10 py-3 rounded-xl hover:bg-white/10 transition-colors">
                <span class="material-symbols-outlined text-sm">apple</span>
                <span class="text-xs font-medium">Apple</span>
            </button>
        </div>
    </div>

    <p class="text-center mt-10 text-sm text-white/40">
      New to Pomato? <a href="signup.html" class="text-blue-400 font-bold hover:underline">Create Account</a>
    </p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
      btn.disabled = true;

      const email = document.getElementById('email').value.trim();
      const pwd = document.getElementById('password').value;
      
      setTimeout(() => {
        if(window.auth.login(email, pwd)){
          window.location.href = new URLSearchParams(window.location.search).get('redirect') || 'profile.html';
        } else {
          alert('Invalid credentials');
          btn.innerHTML = originalText;
          btn.disabled = false;
        }
      }, 1000);
    });
  </script>
</body>
</html>
