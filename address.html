<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Address | POMATO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Outfit', sans-serif; background: #030303; color:#fff; overflow-x: hidden; }
    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob { animation: blob 7s infinite; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative px-6 py-20">
  <!-- Background Blobs -->
  <div class="absolute top-0 -left-4 w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob"></div>
  <div class="absolute bottom-0 -right-4 w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob" style="animation-delay: 2s"></div>

  <div class="glass w-full max-w-[550px] p-10 rounded-[3rem] relative z-10">
    <div class="flex items-center gap-4 mb-10">
      <div class="w-12 h-12 rounded-2xl bg-blue-500/10 flex items-center justify-center text-blue-400">
        <span class="material-symbols-outlined">location_on</span>
      </div>
      <div>
        <h2 class="text-2xl font-bold">Shipping Address</h2>
        <p class="text-white/40 text-xs font-medium">Where should we deliver your tech?</p>
      </div>
    </div>

    <form id="addressForm" class="space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="space-y-1.5">
          <label class="text-[10px] font-black text-white/30 uppercase tracking-widest ml-1">Full Name</label>
          <input type="text" id="name" placeholder="John Doe" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-white focus:outline-none focus:border-blue-500 transition-all" required />
        </div>
        <div class="space-y-1.5">
          <label class="text-[10px] font-black text-white/30 uppercase tracking-widest ml-1">Phone Number</label>
          <input type="tel" id="phone" placeholder="+91 00000 00000" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-white focus:outline-none focus:border-blue-500 transition-all" required />
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="text-[10px] font-black text-white/30 uppercase tracking-widest ml-1">Street Address</label>
        <input type="text" id="street" placeholder="House No, Street, Landmark" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-white focus:outline-none focus:border-blue-500 transition-all" required />
      </div>

      <div class="grid grid-cols-2 gap-5">
        <div class="space-y-1.5">
          <label class="text-[10px] font-black text-white/30 uppercase tracking-widest ml-1">City</label>
          <input type="text" id="city" placeholder="e.g. Kangra" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-white focus:outline-none focus:border-blue-500 transition-all" required />
        </div>
        <div class="space-y-1.5">
          <label class="text-[10px] font-black text-white/30 uppercase tracking-widest ml-1">State</label>
          <input type="text" id="state" placeholder="HP" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-white focus:outline-none focus:border-blue-500 transition-all" required />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-5">
        <div class="space-y-1.5">
          <label class="text-[10px] font-black text-white/30 uppercase tracking-widest ml-1">PIN Code</label>
          <input type="text" id="pin" placeholder="176206" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-white focus:outline-none focus:border-blue-500 transition-all" required />
        </div>
        <div class="space-y-1.5">
          <label class="text-[10px] font-black text-white/30 uppercase tracking-widest ml-1">Country</label>
          <select id="country" class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-white focus:outline-none focus:border-blue-500 transition-all appearance-none">
            <option value="India" class="bg-zinc-900">India</option>
          </select>
        </div>
      </div>

      <div class="flex flex-col gap-4 pt-4">
        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-600/20 transition-all active:scale-95">
          Save Address
        </button>
        <a href="profile.html" class="text-center text-sm text-white/30 hover:text-white transition-colors">Cancel</a>
      </div>
    </form>
  </div>
  
  <script src="js/auth.js"></script>
  <script>
    if (!window.auth.isAuthenticated()) {
      window.location.href = 'login.html';
    }
    
    document.getElementById('addressForm').addEventListener('submit', function(e){
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
      btn.disabled = true;

      const address = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        street: document.getElementById('street').value,
        city: document.getElementById('city').value,
        state: document.getElementById('state').value,
        pin: document.getElementById('pin').value,
        country: document.getElementById('country').value
      };
      
      setTimeout(() => {
        if (window.auth.saveAddress(address)) {
          const referrer = document.referrer;
          if (referrer.includes('checkout.html')) {
            window.location.href = 'checkout.html';
          } else {
            window.location.href = 'profile.html';
          }
        }
      }, 800);
    });
  </script>
</body>
</html>
